<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloCards - Cyclisme Fantasy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    
    /* Style du Paquet de Booster 3D */
    .booster-pack {
      position: relative;
      width: 180px;
      height: 260px;
      border-radius: 12px;
      perspective: 1000px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .booster-pack:hover {
      transform: translateY(-8px) rotateY(10deg);
    }
    .booster-bronze {
      background: linear-gradient(135deg, #8c5220 0%, #3a1d07 100%);
      border: 3px solid #cd7f32;
      box-shadow: 0 10px 20px rgba(205, 127, 50, 0.3);
    }
    .booster-argent {
      background: linear-gradient(135deg, #a0a0a0 0%, #303030 100%);
      border: 3px solid #e0e0e0;
      box-shadow: 0 10px 20px rgba(224, 224, 224, 0.3);
    }
    .booster-gold {
      background: linear-gradient(135deg, #ffd700 0%, #665200 100%);
      border: 3px solid #fff099;
      box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
    }

    /* Style de la Carte de Collection */
    .trading-card {
      width: 220px;
      height: 320px;
      border-radius: 16px;
      position: relative;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-size: cover;
      background-position: center;
    }
    .trading-card:hover {
      transform: translateY(-5px) scale(1.02);
    }

    /* Raretés des Cartes */
    .card-bronze {
      border: 4px solid #cd7f32;
      background: linear-gradient(180deg, rgba(205, 127, 50, 0.2) 0%, rgba(15, 23, 42, 0.95) 80%);
      box-shadow: 0 0 15px rgba(205, 127, 50, 0.2);
    }
    .card-argent {
      border: 4px solid #c0c0c0;
      background: linear-gradient(180deg, rgba(192, 192, 192, 0.2) 0%, rgba(15, 23, 42, 0.95) 80%);
      box-shadow: 0 0 15px rgba(192, 192, 192, 0.3);
    }
    .card-gold {
      border: 4px solid #ffd700;
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.25) 0%, rgba(15, 23, 42, 0.95) 80%);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }
    .card-legendary {
      border: 4px solid #e056fd;
      background: linear-gradient(180deg, rgba(224, 86, 253, 0.3) 0%, rgba(15, 23, 42, 0.95) 80%);
      box-shadow: 0 0 25px rgba(224, 86, 253, 0.6);
    }

    /* Animation d'ouverture */
    @keyframes cardPop {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.1) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }
    .animate-pop {
      animation: cardPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Navigation -->
  <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-bicycle text-yellow-400 text-2xl"></i>
        <span class="font-extrabold text-xl tracking-wider text-white">VELO<span class="text-yellow-400">CARDS</span></span>
      </div>
      <div class="flex space-x-6 text-sm font-semibold">
        <button onclick="showTab('boosters')" class="hover:text-yellow-400 transition"><i class="fa-solid fa-box-open mr-1"></i> Boosters</button>
        <button onclick="showTab('collection')" class="hover:text-yellow-400 transition"><i class="fa-solid fa-layer-group mr-1"></i> Collection</button>
      </div>
      <div class="bg-gray-800 px-4 py-2 rounded-full border border-gray-700 flex items-center space-x-2">
        <i class="fa-solid fa-coins text-yellow-400"></i>
        <span id="coins-display" class="font-bold text-yellow-400">1000</span>
      </div>
    </div>
  </nav>

  <!-- Contenu Principal -->
  <main class="flex-grow max-w-7xl mx-auto p-6 w-full">

    <!-- Section Boosters -->
    <section id="tab-boosters" class="space-y-6">
      <h2 class="text-2xl font-bold border-b border-gray-800 pb-2">Boutique de Boosters</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 justify-items-center">
        <!-- Booster Bronze -->
        <div class="flex flex-col items-center space-y-4">
          <div class="booster-pack booster-bronze flex flex-col items-center justify-between p-4 text-center">
            <span class="text-xs font-black uppercase text-amber-200 tracking-widest">Saison 2026</span>
            <div>
              <i class="fa-solid fa-bolt text-4xl text-amber-300 my-4"></i>
              <h3 class="font-black text-xl text-white uppercase">BRONZE</h3>
            </div>
            <span class="text-xs text-amber-200">1 Carte Cycliste</span>
          </div>
          <button onclick="buyBooster('bronze', 100)" class="bg-amber-700 hover:bg-amber-600 font-bold py-2 px-6 rounded-full transition shadow-lg">Ouvrir (100 🪙)</button>
        </div>

        <!-- Booster Argent -->
        <div class="flex flex-col items-center space-y-4">
          <div class="booster-pack booster-argent flex flex-col items-center justify-between p-4 text-center">
            <span class="text-xs font-black uppercase text-gray-200 tracking-widest">Saison 2026</span>
            <div>
              <i class="fa-solid fa-shield-halved text-4xl text-gray-200 my-4"></i>
              <h3 class="font-black text-xl text-white uppercase">ARGENT</h3>
            </div>
            <span class="text-xs text-gray-300">1 Carte Cycliste</span>
          </div>
          <button onclick="buyBooster('argent', 250)" class="bg-gray-600 hover:bg-gray-500 font-bold py-2 px-6 rounded-full transition shadow-lg">Ouvrir (250 🪙)</button>
        </div>

        <!-- Booster Gold -->
        <div class="flex flex-col items-center space-y-4">
          <div class="booster-pack booster-gold flex flex-col items-center justify-between p-4 text-center">
            <span class="text-xs font-black uppercase text-yellow-900 tracking-widest">Saison 2026</span>
            <div>
              <i class="fa-solid fa-crown text-4xl text-yellow-200 my-4"></i>
              <h3 class="font-black text-xl text-yellow-100 uppercase">GOLD</h3>
            </div>
            <span class="text-xs text-yellow-900 font-bold">Chances Rares +++</span>
          </div>
          <button onclick="buyBooster('gold', 500)" class="bg-yellow-500 text-gray-900 hover:bg-yellow-400 font-bold py-2 px-6 rounded-full transition shadow-lg">Ouvrir (500 🪙)</button>
        </div>
      </div>

      <!-- Zone d'ouverture d'animation de Carte -->
      <div id="drop-zone" class="hidden bg-gray-900/90 border border-gray-800 p-8 rounded-2xl text-center mt-8 backdrop-blur">
        <h3 class="text-xl font-bold mb-6 text-yellow-400">Nouveau Tirage !</h3>
        <div class="flex justify-center">
          <div id="card-result"></div>
        </div>
      </div>
    </section>

    <!-- Section Collection -->
    <section id="tab-collection" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h2 class="text-2xl font-bold">Ma Collection</h2>
        <span id="collection-count" class="text-sm text-gray-400">0 carte(s)</span>
      </div>
      <div id="collection-grid" class="flex flex-wrap gap-6 justify-center sm:justify-start"></div>
    </section>

  </main>

  <script>
    // Liste des coureurs avec visuels d'illustration
    const CYCLISTES = [
      { id: 1, name: "Tadej Pogačar", team: "UAE Team Emirates", rarity: "Légendaire", value: 500, stats: 99, img: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=400&q=80", proba: { bronze: 0, argent: 2, gold: 10 } },
      { id: 2, name: "Jonas Vingegaard", team: "Visma-Lease a Bike", rarity: "Légendaire", value: 450, stats: 97, img: "https://images.unsplash.com/photo-1517649763962-0c623266010b?auto=format&fit=crop&w=400&q=80", proba: { bronze: 0, argent: 3, gold: 12 } },
      { id: 3, name: "Remco Evenepoel", team: "Soudal Quick-Step", rarity: "Gold", value: 300, stats: 94, img: "https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?auto=format&fit=crop&w=400&q=80", proba: { bronze: 2, argent: 10, gold: 25 } },
      { id: 4, name: "Wout van Aert", team: "Visma-Lease a Bike", rarity: "Gold", value: 250, stats: 92, img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=400&q=80", proba: { bronze: 5, argent: 15, gold: 25 } },
      { id: 5, name: "Mathieu van der Poel", team: "Alpecin-Deceuninck", rarity: "Gold", value: 250, stats: 93, img: "https://images.unsplash.com/photo-1511994298241-608e28f14fde?auto=format&fit=crop&w=400&q=80", proba: { bronze: 5, argent: 15, gold: 25 } },
      { id: 6, name: "Julian Alaphilippe", team: "Tudor Pro Cycling", rarity: "Argent", value: 100, stats: 85, img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=400&q=80", proba: { bronze: 25, argent: 30, gold: 30 } },
      { id: 7, name: "Équipier Grimpore", team: "Continental Team", rarity: "Bronze", value: 20, stats: 72, img: "https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=400&q=80", proba: { bronze: 68, argent: 25, gold: 3 } }
    ];

    let state = {
      coins: parseInt(localStorage.getItem('coins')) || 1000,
      collection: JSON.parse(localStorage.getItem('collection')) || []
    };

    function updateUI() {
      document.getElementById('coins-display').innerText = state.coins;
      document.getElementById('collection-count').innerText = `${state.collection.length} carte(s)`;
      localStorage.setItem('coins', state.coins);
      localStorage.setItem('collection', JSON.stringify(state.collection));
      renderCollection();
    }

    function showTab(tabName) {
      ['boosters', 'collection'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    }

    function createCardHTML(card, showSellButton = false) {
      let rarityClass = "card-bronze";
      if(card.rarity === "Argent") rarityClass = "card-argent";
      if(card.rarity === "Gold") rarityClass = "card-gold";
      if(card.rarity === "Légendaire") rarityClass = "card-legendary";

      return `
        <div class="trading-card ${rarityClass}">
          <div class="flex justify-between items-center z-10">
            <span class="text-[10px] font-black uppercase tracking-widest bg-black/60 px-2 py-0.5 rounded text-white">${card.rarity}</span>
            <span class="text-lg font-black text-yellow-400 bg-black/60 px-2 py-0.5 rounded">${card.stats}</span>
          </div>
          
          <div class="my-2 rounded-lg h-36 bg-cover bg-center border border-white/10" style="background-image: url('${card.img}')"></div>
          
          <div class="z-10 bg-black/70 p-2 rounded-lg backdrop-blur-sm">
            <h4 class="font-black text-sm text-white truncate">${card.name}</h4>
            <p class="text-[10px] text-gray-400 truncate">${card.team}</p>
          </div>

          ${showSellButton ? `
            <button onclick="sellCard(${card.instanceId},${card.value})" class="mt-2 w-full bg-red-600/80 hover:bg-red-600 text-[11px] font-bold py-1.5 rounded transition">
              Vendre (+${card.value} 🪙)
            </button>
          ` : ''}
        </div>
      `;
    }

    function buyBooster(type, price) {
      if (state.coins < price) return alert("Pas assez de pièces !");
      state.coins -= price;

      let pool = [];
      CYCLISTES.forEach(c => {
        let weight = c.proba[type];
        for (let i = 0; i < weight; i++) pool.push(c);
      });

      const drawnCard = pool[Math.floor(Math.random() * pool.length)];
      const cardInstance = { ...drawnCard, instanceId: Date.now() };
      state.collection.push(cardInstance);

      const dropZone = document.getElementById('drop-zone');
      const cardResult = document.getElementById('card-result');
      dropZone.classList.remove('hidden');

      cardResult.className = "animate-pop";
      cardResult.innerHTML = createCardHTML(cardInstance, false);

      updateUI();
    }

    function renderCollection() {
      const grid = document.getElementById('collection-grid');
      grid.innerHTML = '';
      state.collection.forEach(card => {
        grid.innerHTML += createCardHTML(card, true);
      });
    }

    function sellCard(instanceId, value) {
      state.collection = state.collection.filter(c => c.instanceId !== instanceId);
      state.coins += value;
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
